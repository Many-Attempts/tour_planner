<div class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-icon">&#9978;</div>
        <h1 class="title">Tour Planner</h1>
        <p class="subtitle">
          {{ vm.isLogin() ? 'Login to your account' : 'Create new account' }}
        </p>
      </div>

      @if (vm.error()) {
        <div class="error-message">
          {{ vm.error() }}
        </div>
      }

      <form (ngSubmit)="vm.submit()" class="login-form">
        @if (!vm.isLogin()) {
          <div class="form-group">
            <label class="form-label">NAME</label>
            <input
              type="text"
              class="form-control"
              placeholder="Enter your name"
              [ngModel]="vm.name()"
              (ngModelChange)="vm.name.set($event)"
              name="name"
              required
            />
          </div>
        }

        <div class="form-group">
          <label class="form-label">EMAIL</label>
          <input
            type="email"
            class="form-control"
            placeholder="Enter your email"
            [ngModel]="vm.email()"
            (ngModelChange)="vm.email.set($event)"
            name="email"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label">PASSWORD</label>
          <input
            type="password"
            class="form-control"
            placeholder="Enter your password"
            [ngModel]="vm.password()"
            (ngModelChange)="vm.password.set($event)"
            name="password"
            required
          />
        </div>

        @if (!vm.isLogin()) {
          <div class="form-group">
            <label class="form-label">CONFIRM PASSWORD</label>
            <input
              type="password"
              class="form-control"
              placeholder="Confirm your password"
              [ngModel]="vm.confirmPassword()"
              (ngModelChange)="vm.confirmPassword.set($event)"
              name="confirmPassword"
              required
            />
          </div>
        }

        <button type="submit" class="submit-btn">
          {{ vm.isLogin() ? 'LOGIN' : 'REGISTER' }}
        </button>
      </form>

      <div class="toggle-section">
        <button (click)="vm.toggleMode()" class="toggle-btn">
          @if (vm.isLogin()) {
            <div>
              Don't have an account? <span class="toggle-link">Register</span>
            </div>
          } @else {
            <div>
              Already have an account? <span class="toggle-link">Login</span>
            </div>
          }
        </button>
      </div>

    </div>
  </div>
</div>
